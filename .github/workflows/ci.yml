# CI (GDD §23). `npm run ci` runs the same steps locally.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Format tests under de_DE
        run: npx vitest run tests/unit/format.test.ts
        env:
          LANG: de_DE.UTF-8
          LC_ALL: de_DE.UTF-8
          ISI_EXPECT_LOCALE: de
